name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      outcome:
        description: How the test job ends
        type: choice
        options: [success, failure]
        default: success
      message:
        description: Text printed by the build job
        type: string
        default: hello
      slow:
        description: Sleep 60 seconds to watch a running job
        type: boolean
        default: false
      environment:
        description: Target environment
        type: environment
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Print message
        env:
          MESSAGE: ${{ inputs.message || 'push' }}
        run: echo "message: $MESSAGE"
      - name: Slow step
        if: ${{ inputs.slow }}
        run: for i in $(seq 1 12); do echo "tick $i"; sleep 5; done

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Run shard
        env:
          OUTCOME: ${{ inputs.outcome || 'success' }}
          SHARD: ${{ matrix.shard }}
        run: |
          echo "shard $SHARD"
          if [ "$OUTCOME" = failure ] && [ "$SHARD" = 2 ]; then
            echo "::error file=src/greeting.txt,line=2::Sandbox failure requested"
            exit 1
          fi
